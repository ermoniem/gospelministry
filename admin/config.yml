backend:
  name: git-gateway
  branch: main # or 'master' depending on your GitHub branch name

media_folder: "images/uploads" # Where uploaded images will be stored
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Ministry Posts & News"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Education", "Spiritual", "Economic", "Social"] }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Content Description", name: "body", widget: "markdown" }
